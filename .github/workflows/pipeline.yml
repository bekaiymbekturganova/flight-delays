name: run pipeline
# Downloads real BTS data, trains the model and publishes the results page.
# Start it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First month (YYYY-MM)"
        default: "2024-07"
      end:
        description: "Last month (YYYY-MM)"
        default: "2025-06"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download, clean, build features, train, report
        run: flightdelays all --start "${{ inputs.start }}" --end "${{ inputs.end }}"
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: artifacts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
